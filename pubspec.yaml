name: PhotoFlow
description: BMS Client - Flutter app (màn hình đăng nhập + lưu phiên đăng nhập dùng chung).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter_colorpicker: ^1.1.0

  flutter:
    sdk: flutter

  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

  # Quản lý state dùng chung (stores/)
  provider: ^6.1.2

  # Gọi API (apis/)
  dio: ^5.5.0+1

  # Biến môi trường (.env -> configs/env.dart)
  flutter_dotenv: ^5.1.0

  # Lưu token an toàn (utils/token_storage.dart)
  flutter_secure_storage: ^11.2.0

  # Hiển thị logo SVG (widgets/app_header.dart)
  flutter_svg: ^2.0.10+1
  http: ^1.6.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  rename_app: ^1.6.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/images/logo.svg

flutter_launcher_icons:
  image_path: "lib/assets/images/logo.svg"

  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "lib/assets/images/logo.svg"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "lib/assets/images/logo.svg"
    icon_size: 256

  macos:
    generate: true
    image_path: "lib/assets/images/logo.svg"
